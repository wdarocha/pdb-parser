[build-system]
requires = ["setuptools>=69", "wheel", "tomli>=1.1; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb-parser"  # distribution name (can use hyphen)
dynamic = ["version"]
description = "Lightweight PDB parser for Python -- focused on generating distance-constraint lists and torsion-angle data, tailored for Distance Geometry Problem (DGP) workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wagner da Rocha" }]

dependencies = [
    "numpy>=1.23,<3",
    "pandas>=1.5,<3",
    "scipy>=1.9,<2",
    "requests>=2.28,<3",
    "MDAnalysis>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.6",
    "pytest-cov>=5",
    # The packaging tests build the wheel without isolation and run setup.py; Python 3.12+
    # environments no longer ship setuptools.
    "setuptools>=69",
    "wheel",
]

[project.scripts]
pdb-parser = "pdb_parser.pdb_parser:main"
instance-remap = "pdb_parser.instance_remap:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pdb_parser.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdb_parser", "pdb_parser.*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pdb_parser"]

[tool.coverage.report]
fail_under = 70
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = ["E101", "E501"] # legacy docstrings, residue-topology tables, and fixed-format fixtures

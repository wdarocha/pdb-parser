# Model number used to build the parser-stage output files
model_number: 1

# Chain identifier used to build the parser-stage output files
chain_id: A

# Ordering choice for the instance reordering stage.
# The first residue R1 is initialized separately, according to the
# N-terminal hydrogens available in that residue. The implemented
# initialization patterns are:
#   1 | H3 -> H2 -> h  -> N -> CA -> ha -> C -> ...
#   2 | H3 -> h  -> H1 -> N -> CA -> ha -> C -> ...
#   3 | h  -> H2 -> H1 -> N -> CA -> ha -> C -> ...
#   4 | H2 -> h  -> N  -> CA -> ha -> C -> ...
#   5 | H3 -> h  -> N  -> CA -> ha -> C -> ...
#   6 | N  -> CA -> C  -> ha -> h  -> ...
#
# Here:
#   h  = H for standard residues, or HD2/HD3 for PRO
#   ha = HA for standard residues, or HA2/HA3 for GLY
#
# For each internal residue Ri (i >= 2), the 10 available orderings are:
#   1  | ... -> N  -> CA -> C  -> h -> ha -> ...
#   2  | ... -> N  -> CA -> C  -> ha -> h -> ...
#   3  | ... -> N  -> CA -> h -> ha -> C  -> ...
#   4  | ... -> N  -> CA -> h -> C  -> ha -> ...
#   5  | ... -> N  -> h -> CA -> ha -> C  -> ...
#   6  | ... -> N  -> h -> CA -> C  -> ha -> ...
#   7  | ... -> h -> N  -> CA -> ha -> C  -> ...
#   8  | ... -> h -> N  -> CA -> C  -> ha -> ...
#   9  | ... -> h -> CA -> N  -> ha -> C  -> ...
#  10  | ... -> h -> CA -> N  -> C  -> ha -> ...
#
# In these patterns:
#   h  = HN for standard residues, or HD2/HD3 for PRO
#   ha = HA for standard residues, or HA2/HA3 for GLY
#
# The value below selects which internal-residue ordering is used.
order_id: 9

# Instance remapping (instance-remap)
#
# Reads the parser-stage files X_*, A_* and I_* of one chain and writes them again in
# a vertex order: X_*, I_* and T_* in <out_dir>/<pdb_id>/remapped/.
#
# Accepted parser outputs (output_mode: parser_outputs):
#   NMR    backbone_plus_hydrogens  | order_type ddgp or redmdgp, with order_id (below)
#   NMR    backbone                 | order_type dmdgp: fixed DMDGP order N CA C
#                                   | (*_dmdgp_order.dat), no order_id needed; with
#                                   | ddgp or redmdgp, the same order and a warning
#   X-ray  backbone                 | order_type dmdgp, as for NMR
# Not remappable: full_chain and backbone_plus_neighbors. For X-ray, the parser turns
# backbone_plus_hydrogens into backbone_plus_neighbors (no hydrogens), so only backbone
# can be remapped.
#
# Before writing, the remap checks that X_*, A_* and I_* describe the same chain:
# consecutive residues (gaps are rejected), positive and unique atom ids, and every
# I_* atom present in X_*.
#
# Syntax: one "key: value" pair per line; "#" starts a comment.
# The atom orders selected by order_type and order_id are listed at the end of this file.

# Model number used by the parser stage
# -------------------------------------------------
model_number: 1
# -------------------------------------------------

# Chain identifier used by the parser stage
# -------------------------------------------------
chain_id: A
# -------------------------------------------------

# Order type (optional; default: ddgp)
#   ddgp	| iDDGP order: each vertex is placed from three earlier vertices,
#		| not necessarily the immediately preceding ones.
#		| Outputs: *_ddgp_order_<order_id>.dat
#   redmdgp	| iDMDGP re-order of the same order_id: every vertex i is placed from
#		| i-1, i-2 and i-3, repeating atoms when needed (a repeated atom is a
#		| new vertex with the same coordinates).
#		| Outputs: *_redmdgp_hc_order_<order_id>.dat
#   dmdgp	| fixed DMDGP order N CA C of backbone outputs (NMR or X-ray): every
#		| vertex i is placed from i-1, i-2 and i-3. order_id is not needed.
#		| Outputs: *_dmdgp_order.dat
# ddgp and redmdgp can be written in one call (order_type: ddgp, redmdgp); dmdgp is
# for backbone outputs and cannot be combined with them.
# Example, backbone outputs (parser run with atom_selection: backbone):
#   order_type: dmdgp	(order_id below may be removed; if kept, it is ignored)
# -------------------------------------------------
order_type: ddgp
# -------------------------------------------------

# Order identifier
#   1 to 10	| one fixed order for every internal residue
# Several orders can be written in one call, which reads the parser files once:
#   order_id: 1-10, order_id: 1,3,9 or order_id: 1-4,9
# -------------------------------------------------
order_id: 9
# -------------------------------------------------

# ===================================================================================
# Reference: atom order of each residue
# ===================================================================================
#
# Atom names:
#   h		| H; in PRO, the HD2 or HD3 kept by the parser (the one nearer HA of the
#		| previous residue); in residue 1, H1 or H (HD2 or HD3 in PRO)
#   ha		| HA (HA2 or HA3 in GLY)
#   h1 h2 h3	| N-terminal hydrogens of residue 1 in placement order (positions, not
#		| the atom names H1 H2 H3): the order of the ddgp residue-1 row, so with
#		| H3, H2 and h, h1 = H3, h2 = H2 and h3 = h
#
# Interval marks (both order types). A marked atom is placed by an interval to its
# farthest reference vertex (i-3 in redmdgp), and the search branches there, except
# for a marked copy in redmdgp (no brackets), which its [0, 0] places on the earlier one:
#   (psi)	| psi torsion N(k-1)-CA(k-1)-C(k-1)-N(k), interval from A_*;
#		| places N(k) from N(k-1)
#   (phi)	| phi torsion C(k-1)-N(k)-CA(k)-C(k), interval from A_*;
#		| places C(k) from C(k-1)
#   (NOE)	| H-H distance interval from I_*: HN(k)-HA(k) or HA(k-1)-HN(k);
#		| in residue 1, the last N-terminal hydrogen and HA
#   no mark	| placed by exact distances (bonds, bond angles, peptide plane);
#		| in redmdgp, also a copy of i-3 itself (zero distance, redmdgp only)
#
# order_type: ddgp
# ----------------
# Residue 1, by the N-terminal hydrogens present:
#   H3, H2 and h	| H3 H2 h  N  CA ha(NOE) C
#   H3, H1 and h	| H3 h  H1 N  CA ha(NOE) C
#   H2, H1 and h	| h  H2 H1 N  CA ha(NOE) C
#   H2 and h		| H2 h  N  CA ha(NOE) C
#   H3 and h		| H3 h  N  CA ha(NOE) C
#   h only		| N  CA C  ha h(NOE)
#
# Residues 2 to n (order_id):
#   1	| N(psi) CA C(phi) h ha
#   2	| N(psi) CA C(phi) ha h
#   3	| N(psi) CA h ha(NOE) C
#   4	| N(psi) CA h C(phi) ha
#   5	| N(psi) h CA ha(NOE) C
#   6	| N(psi) h CA C(phi) ha
#   7	| h(NOE) N CA ha(NOE) C
#   8	| h(NOE) N CA C(phi) ha
#   9	| h(NOE) CA N ha(NOE) C
#   10	| h(NOE) CA N C(phi) ha
#
# order_type: redmdgp
# -------------------
# Notation:
#   [X]			| first occurrence of atom X
#   X			| a repeated X (copy, same coordinates as [X]); in I_* it has
#			| exactly one [0, 0], with the previous occurrence of X
#   X-1			| atom of the previous residue
# The first occurrences follow the ddgp order of the same order_id.
#
# Residue 1, orders 1 to 6:
#   h1 h2 h3	| [h1] [h2] [h3] [N] [CA] [ha](NOE) N CA [C]
#   h1 h2	| [h1] [h2] [N] [CA] [ha](NOE) N CA [C]
#   h only	| [N] [CA] [C] [ha] N CA [h](NOE) N CA ha(NOE) N CA C
#
# Residue 1, orders 7 to 10:
#   h1 h2 h3	| [h1] [h2] [h3] [N] [CA] [ha](NOE) [C] CA
#   h1 h2	| [h1] [h2] [N] [CA] [ha](NOE) [C] CA
#   h only	| [N] [CA] [C] [ha] N CA [h](NOE) N CA ha(NOE) C CA
#
# Residues 2 to n-1 (order_id):
#   1	| [N](psi) [CA] [C](phi) N CA C-1(phi) [h] CA-1 C-1 N CA C(phi) [ha] N CA C
#   2	| [N](psi) [CA] [C](phi) [ha] CA C N CA C-1(phi) [h] CA-1 C-1 N CA C(phi)
#   3	| [N](psi) [CA] [h] N CA [ha](NOE) N CA [C]
#   4	| [N](psi) [CA] [h] C-1 N CA [C](phi) [ha] N CA C
#   5	| [N](psi) [h] [CA] N [ha](NOE) [C] N CA C
#   6	| [N](psi) [h] C-1 N [CA] [C](phi) [ha] N CA C
#   7	| [h](NOE) [N] [CA] [ha](NOE) [C] CA
#   8	| [h](NOE) C-1 [N] [CA] [C](phi) N [ha] C CA
#   9	| [h](NOE) [CA] [N] [ha](NOE) [C] CA
#   10	| [h](NOE) [CA] C-1 [N] CA [C](phi) [ha] CA C
#
# Residue n: the residue 2 to n-1 row, cut after its last first occurrence.

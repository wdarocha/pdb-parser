# Experimental method: auto detects only NMR or X-RAY DIFFRACTION from EXPDTA.
# -------------------------------------------------
method: auto
# -------------------------------------------------

# Output stage:
#   filtered_atoms		| writes only filtered coordinates
#   parser_outputs		| writes X, A and I
# -------------------------------------------------
output_mode: parser_outputs
# -------------------------------------------------

# Model number: select which MODEL from the PDB file will be used.
# For a one-model X-ray structure, its sole coordinate set is used even when another model is requested.
# -------------------------------------------------
model_number: 1
# -------------------------------------------------

# Chain identifier: select exactly one chain (segid or chainID) in the chosen model.
# Residues numbered <= 0 are dropped with a warning; the remaining ones must be consecutive (the first may be any number).
# Insertion codes: per residue number, the blank code is kept (otherwise the first code); the others are discarded with a warning.
# Consecutive residues must be bonded: a C(i)-N(i+1) distance above 2.0 A is a chain break and the structure is rejected.
# Altloc policy: blank is preferred, otherwise the lexicographically first conformer per residue/atom.
# Supported covalent-topology residues: ALA GLY PRO SER THR VAL LEU ILE MET CYS
# ASN GLN ASP GLU HIS PHE TYR TRP LYS ARG. Other protein residues are rejected.
# -------------------------------------------------
chain_id: A
# -------------------------------------------------

# Atom selection mode:
#   full_chain			| all atoms in the selected chain
#   backbone			| backbone atoms only (N, CA, C)
#   backbone_plus_hydrogens	| backbone atoms + directly bonded hydrogens; in PRO, the delta
#				| hydrogen (HD2 or HD3) nearer the previous residue's HA
#   backbone_plus_neighbors	| backbone atoms + directly neighboring atoms
# -------------------------------------------------
atom_selection: backbone_plus_hydrogens
# -------------------------------------------------

# Long-range distance constraints mode (method-dependent)
#   (note: covalent, planar, and peptide-group distances are always treated as precise)
#
#   NMR: when hydrogens are not explicitly included (e.g. atom_selection = backbone),
#   NOE proton restraints are mapped as HN -> N and HA -> C, yielding heavy-atom
#   pairs such as N-N, N-C, and C-C. Reference distances d_ij are obtained directly from the PDB structure.
#
#   NMR precise			| treat NMR distances as exact values
#   NMR interval_centered	| synthetic intervals around d_ij:
#				|   D_ij = [max{d*_ij - ε_ij/2, vdw_ij},
#				|           min{d*_ij + ε_ij/2, max_distance}]
#				|   where d*_ij ~ N(d_ij, (ε_ij / 8)^2), with
#				|   ε_ij = 8σ (i.e., ±4σ around the mean); d*_ij is
#				|   drawn again until D_ij contains d_ij.
#				|   uses: epsilon_short, epsilon_long, max_distance,
#				|         vdwr_hh
#   NMR interval_experimental	| NOESY-based intervals using intensity classes
#				| (strong, medium, weak)
#				|   D_ij = [vdw_ij, d_class]
#				|   where d_class ∈ {noe_strong, noe_medium, noe_weak} (upper bounds)
#
#   In both interval modes, vdw_ij = vdwr_hh when vdwr_hh < d_ij; otherwise the first of
#   90%, 80%, ..., 10% of vdwr_hh below d_ij, or 0.9 d_ij if even 10% is not below it.
#   The reference structure always satisfies its intervals.
#				|   uses: noe_strong, noe_medium, noe_weak, vdwr_hh
#
#   X-ray precise		| exact CA--CA long-range distances below max_distance.
#   X-ray interval_centered	| CA--CA intervals using epsilon_long and max_distance.
#				| epsilon_short and vdwr_hh are not used for X-ray. The CA--CA
#				| lower bound is internal: vdw_caca = 2 * vdw_c = 3.40 Å,
#				| adjusted by alpha when needed.
#   X-ray interval_experimental	| automatically converted to interval_centered with a warning.
# -------------------------------------------------
distance_constraints: interval_experimental
# -------------------------------------------------

# Parameters for distance_constraints = interval_centered
# epsilon_short: NMR only. epsilon_long and max_distance: NMR and X-ray.
# -------------------------------------------------
epsilon_short: 1.0	# interval width ε_ij for atoms in the same or adjacent residues (suggested: 1.0 Å)
epsilon_long:  2.0	# interval width ε_ij for atoms in non-adjacent residues (suggested: 2.0 Å)
max_distance:  5.0	# upper bound for interval distances (suggested: 5.0 Å)
# -------------------------------------------------

# NMR-only parameters for distance_constraints = interval_experimental
# -------------------------------------------------
noe_strong: 2.5		# upper distance bound for strong NOE peaks (suggested: 2.5 Å)
noe_medium: 3.5		# upper distance bound for medium NOE peaks (suggested: 3.5 Å)
noe_weak:   5.0		# upper distance bound for weak NOE peaks (suggested: 5.0 Å)
# -------------------------------------------------

# NMR-only shared parameter for interval modes
# -------------------------------------------------
vdwr_hh: 1.8		# van der Waals radius for H-H (suggested: 1.8 Å)
# -------------------------------------------------

# NMR-only percentage of the NOE-like H-H distance constraints to keep [0-100 %]
# These are all H-H pairs accepted by distance_constraints, at any sequence separation.
# Applies to every distance_constraints mode, including precise, and to the N/C proxy
# pairs used when atom_selection = backbone. The kept constraints are drawn at random
# (reproducible through seed_hh_distance_subset); the remaining ones are discarded.
# The H-H discretization edges used by the remap stage (HN_i-HA_i and HA_{i-1}-HN_i)
# are always kept; the percentage applies to the other H-H pairs.
# Covalent, planar, peptide-group and torsion-derived distances are always kept.
# Optional; defaults to 100.0. Ignored for X-ray.
# -------------------------------------------------
percentage_hh_distance_constraints: 100.0
# -------------------------------------------------

# Collect van der Waals lower-bound distance constraints (yes | no)
# If distance_constraints = precise, the parser overrides this value to no.
# -------------------------------------------------
vdw_constraints: yes
# -------------------------------------------------

# Replace every upper bound in I_* by its shortest path in the graph of the finite (<= 998)
# upper bounds (yes | no). This includes the 999 upper bounds of the van der Waals rows, which
# then get the shortest-path value; a pair without a finite path is an error.
# Optional; defaults to no. If distance_constraints = precise, the parser overrides this value to no.
# -------------------------------------------------
tightening_upper_bounds: yes
# -------------------------------------------------

# Width of torsion angle intervals (degrees)
#
# The reference torsion angle τ_ij is obtained from the PDB structure.
# A perturbed value τ*_ij is sampled from a normal distribution
#     τ*_ij ~ N(τ_ij , (torsion_angle_width / 8)^2)
# and the torsion interval is defined as
#     [τ*_ij - torsion_angle_width/2 , τ*_ij + torsion_angle_width/2].
# With this definition, torsion_angle_width corresponds to 8σ (i.e., ±4σ around the mean).
# If distance_constraints = precise, the parser overrides this value to 0.0.
# -------------------------------------------------
torsion_angle_width: 60.0
# -------------------------------------------------

# Percentage of estimated backbone torsion angles (phi/psi) to include [0-100 %]
# Selected angles are generated as intervals as described above.
# Angles not included in this percentage receive the default range [-180°, 180°].
# If distance_constraints = precise, the parser overrides this value to 100.0.
# -------------------------------------------------
percentage_backbone_torsion_angles: 100.0
# -------------------------------------------------
